# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Private-beta evaluation only. Verify workspace free allowances and no payment method first.
# AI stays disabled until free provider access and a durable external usage ledger are verified.
services:
  - type: web
    name: tickerbrief-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 16 --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SEC_USER_AGENT
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "http://127.0.0.1:8081,http://localhost:8081"
